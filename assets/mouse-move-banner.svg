<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Mouse Move</title>
  <desc id="bannerDesc">Mouse Move keeps your presence active by nudging the pointer in a small square when you go idle.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#111c33"/>
      <stop offset="1" stop-color="#2a2470"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#94a3b8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="900" height="240" rx="28" fill="url(#bg)"/>
  <rect width="900" height="240" rx="28" fill="url(#dots)"/>
  <circle cx="720" cy="120" r="150" fill="url(#halo)"/>

  <g transform="translate(702 100)" fill="none">
    <rect x="-62" y="-62" width="124" height="124" rx="14"
          fill="#6366f1" fill-opacity="0.08"
          stroke="#a5b4fc" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="8 7"/>
    <path d="M0 0 L0 54 L13 41 L21 60 L31 55 L23 36 L40 36 Z"
          fill="#ffffff" stroke="#0b1120" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <text x="64" y="88" fill="#f8fafc"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="54" font-weight="700" letter-spacing="-1">mouse move</text>
  <text x="66" y="128" fill="#c7d2fe"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="20">Keep your status active, one small square at a time.</text>

  <g transform="translate(66 150)">
    <rect x="0" y="0" width="392" height="34" rx="17"
          fill="#ffffff" fill-opacity="0.06"
          stroke="#818cf8" stroke-opacity="0.35"/>
    <circle cx="20" cy="17" r="5" fill="#34d399"/>
    <text x="36" y="22" fill="#cbd5e1"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="14" letter-spacing="0.4">TypeScript · Node.js 22+ · Windows, macOS, Linux</text>
  </g>
</svg>
